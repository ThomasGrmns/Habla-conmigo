<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de video</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f1ec; color: #1d2128; }
  header { padding: 14px 16px; background: #1f3a4d; color: #fff; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 15px; opacity: .85; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 14px; padding: 14px 16px 40px; }
  section { background: #fff; border: 1px solid #d6d1c6; border-radius: 12px; overflow: hidden; }
  h2 { margin: 0; padding: 10px 12px; font-size: 18px; }
  .frame { aspect-ratio: 16 / 9; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .status { padding: 10px 12px; font-size: 16px; font-weight: 700; }
  .ok { color: #1e7d45; } .bad { color: #b8322a; } .wait { color: #59606c; }
</style>
</head>
<body>
<header>
  <h1>Prueba de video</h1>
  <p>Toque ▶ en cada recuadro. Anote cuáles letras (A, B, C, D) muestran el video y suenan.</p>
</header>
<main id="main"></main>
<script>
  const LIST = "PLDIoUOhQQPlWm_njQtKkNIk5RYSGgzomm";
  const VARIANTS = [
    { id: "A", host: "www.youtube-nocookie.com", sandbox: true,  label: "A · nocookie + sandbox (versión anterior)" },
    { id: "B", host: "www.youtube-nocookie.com", sandbox: false, label: "B · nocookie, sin sandbox" },
    { id: "C", host: "www.youtube.com",          sandbox: false, label: "C · youtube.com, sin sandbox (versión nueva)" },
    { id: "D", host: "www.youtube.com",          sandbox: true,  label: "D · youtube.com + sandbox" }
  ];
  const frames = {};
  const set = (id, cls, text) => { const s = document.getElementById("st" + id); s.className = "status " + cls; s.textContent = text; };
  VARIANTS.forEach(v => {
    const sec = document.createElement("section");
    sec.innerHTML = '<h2></h2><div class="frame"></div><div class="status wait" id="st' + v.id + '">Esperando respuesta de YouTube…</div>';
    sec.querySelector("h2").textContent = v.label;
    const f = document.createElement("iframe");
    f.src = "https://" + v.host + "/embed/videoseries?list=" + LIST + "&loop=1&rel=0&playsinline=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin);
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.referrerPolicy = "strict-origin-when-cross-origin";
    if (v.sandbox) f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
    f.addEventListener("load", () => [0, 600, 1500, 3000].forEach(ms => setTimeout(() => {
      try { f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: v.id, channel: "widget" }), "*"); } catch (e) {}
    }, ms)));
    sec.querySelector(".frame").appendChild(f);
    document.getElementById("main").appendChild(sec);
    frames[v.id] = f;
    setTimeout(() => { const s = document.getElementById("st" + v.id); if (s.classList.contains("wait")) set(v.id, "bad", "Sin respuesta de YouTube después de 15 segundos"); }, 15000);
  });
  const STATES = { "-1": "listo", 0: "terminó", 1: "reproduciendo ✓", 2: "en pausa", 3: "cargando", 5: "listo" };
  window.addEventListener("message", e => {
    const id = Object.keys(frames).find(k => frames[k].contentWindow === e.source);
    if (!id) return;
    let d; try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!d) return;
    if (d.event === "onError") set(id, "bad", "Error de YouTube " + d.info);
    else if (d.event === "onReady") set(id, "ok", "YouTube respondió: listo");
    else {
      const st = d.event === "onStateChange" ? d.info : d.info && d.info.playerState;
      if (st !== undefined && STATES[st]) set(id, "ok", "YouTube respondió: " + STATES[st]);
      else if (document.getElementById("st" + id).classList.contains("wait")) set(id, "ok", "YouTube respondió");
    }
  });
</script>
</body>
</html>
